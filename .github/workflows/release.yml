name: Release

# Publish a GitHub Release whenever a semver tag is pushed.
#   git tag -a v1.2.0 -m "v1.2.0" && git push origin v1.2.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"      # v1.2.3-rc.1 (pre-release)

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for notes)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect pre-release
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release body from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## ${GITHUB_REF_NAME}"
            echo
            # Print the matching "## [VERSION]" section, drop reference-style
            # link definitions, and trim leading blank lines.
            awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 { cap=1; next }
              cap && /^## \[/ { exit }
              cap { print }
            ' CHANGELOG.md \
              | grep -vE '^\[[^]]+\]:[[:space:]]*https?://' \
              | sed -e '/./,$!d'
          } > RELEASE_BODY.md
          echo "----- release body -----"
          cat RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_BODY.md       # CHANGELOG section for this version
          generate_release_notes: true     # appends PR notes (.github/release.yml)
          prerelease: ${{ steps.meta.outputs.prerelease }}
          fail_on_unmatched_files: false
