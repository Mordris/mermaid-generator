name: Release

# Publish a GitHub Release whenever a semver tag is pushed.
#   git tag -a v1.2.0 -m "v1.2.0" && git push origin v1.2.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"      # v1.2.3-rc.1 (pre-release)

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect pre-release
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true     # uses .github/release.yml categories
          prerelease: ${{ steps.meta.outputs.prerelease }}
          fail_on_unmatched_files: false
