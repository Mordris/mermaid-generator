server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Correct MIME type for ES modules (app.js is type="module").
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js mjs;
        image/svg+xml                         svg;
    }
    default_type application/octet-stream;

    # Compress text assets.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # Single-file app with no content hashing: revalidate everything so a
    # rebuilt image always serves fresh code (no stale JS/CSS after updates).
    location ~* \.(html|css|js|mjs)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
